[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-studio-mcp"
version = "0.2.0"
description = "Bidirectional MCP server for controlling FL Studio via MIDI SysEx, Win32 GUI automation, and Hard Techno MIDI/WAV synthesis with DSP feedback."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Arnau", email = "arnausagratcor@gmail.com" }]
requires-python = ">=3.10"
keywords = ["fl-studio", "mcp", "midi", "sysex", "music-production", "hard-techno", "daw"]
dependencies = [
    "mcp>=2.3.0",
    "mido>=1.3.3",
    "numpy>=2.2.6",
    "python-rtmidi>=1.5.8",
]

[project.scripts]
fl-studio-mcp = "fl_studio_mcp.server:main"
fl-studio-mcp-doctor = "fl_studio_mcp.doctor:main"

[project.urls]
Homepage = "https://github.com/Arnau10a/fl-studio-mcp"
Repository = "https://github.com/Arnau10a/fl-studio-mcp"
Issues = "https://github.com/Arnau10a/fl-studio-mcp/issues"

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fl_studio_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
